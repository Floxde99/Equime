# CI Equime — Phase 6 : lint + tests + build + E2E.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # Audit des dépendances de production. Le script permet de documenter
      # des exceptions nominatives et datées (scripts/audit-ci.mjs) au lieu
      # d'abaisser le seuil global, qui masquerait les vulnérabilités futures.
      - name: Audit des dépendances
        run: node scripts/audit-ci.mjs

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: equime
          POSTGRES_PASSWORD: equime_dev_password
          POSTGRES_DB: equime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U equime -d equime_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prisma client (JS)
        run: npm run prisma:generate -w apps/api
      - name: Run tests with coverage
        run: npx -w apps/api vitest run --coverage
        env:
          DATABASE_URL_TEST: postgresql://equime:equime_dev_password@localhost:5432/equime_test
          REDIS_URL_TEST: redis://localhost:6379/1
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-api
          path: apps/api/coverage/lcov.info

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w apps/web
      - name: Upload web dist
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist

  e2e:
    name: E2E
    needs: [lint, test, build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Start E2E stack
        run: npm run e2e:stack
      - name: Prepare database and seed
        run: npm run e2e:prepare
        env:
          DATABASE_URL: postgresql://equime:equime_dev_password@localhost:5432/equime
          REDIS_URL: redis://localhost:6379
      - name: Run Playwright suite
        run: npm run e2e
        env:
          PLAYWRIGHT_EXTERNAL_STACK: '1'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report

  # ============================================================
  # Déploiement continu sur le VPS.
  #
  # develop → préproduction (automatique)
  # main    → production (approbation manuelle via l'environnement GitHub)
  #
  # Les deux jobs attendent lint + tests + build + E2E : rien ne part sur le
  # VPS sans que la chaîne de vérification complète soit verte.
  #
  # Secrets requis (Settings → Secrets and variables → Actions) :
  #   VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS
  # Voir docs/deploiement.md § 10.
  # ============================================================

  deploy-preprod:
    name: Déploiement préproduction
    needs: [lint, test, build-web, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: preproduction
      url: https://prequime.florianfaucher.dev
    concurrency:
      group: deploy-preprod
      cancel-in-progress: false
    steps:
      - name: Préparer la connexion SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Déployer
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'set -e; cd /apps/projects/equime-preprod && git pull --ff-only && bash scripts/deploy-vps.sh preprod'
      - name: Nettoyer la clé
        if: ${{ always() }}
        run: rm -f ~/.ssh/deploy_key

  deploy-prod:
    name: Déploiement production
    needs: [lint, test, build-web, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # L'environnement `production` porte la règle d'approbation manuelle :
    # le job reste en attente tant qu'un reviewer n'a pas validé.
    environment:
      name: production
      url: https://equime.florianfaucher.dev
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Préparer la connexion SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Déployer
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'set -e; cd /apps/projects/equime-prod && git pull --ff-only && bash scripts/deploy-vps.sh prod'
      - name: Nettoyer la clé
        if: ${{ always() }}
        run: rm -f ~/.ssh/deploy_key
