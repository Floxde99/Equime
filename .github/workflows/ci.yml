# CI Equime — Phase 6 : lint + tests + build + E2E.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm audit --omit=dev --audit-level=high

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: equime
          POSTGRES_PASSWORD: equime_dev_password
          POSTGRES_DB: equime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U equime -d equime_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prisma client (JS)
        run: npm run prisma:generate -w apps/api
      - name: Run tests with coverage
        run: npx -w apps/api vitest run --coverage
        env:
          DATABASE_URL_TEST: postgresql://equime:equime_dev_password@localhost:5432/equime_test
          REDIS_URL_TEST: redis://localhost:6379/1
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api
          path: apps/api/coverage/lcov.info

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w apps/web
      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

  e2e:
    name: E2E
    needs: [lint, test, build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Start E2E stack
        run: npm run e2e:stack
      - name: Prepare database and seed
        run: npm run e2e:prepare
        env:
          DATABASE_URL: postgresql://equime:equime_dev_password@localhost:5432/equime
          REDIS_URL: redis://localhost:6379
      - name: Run Playwright suite
        run: npm run e2e
        env:
          PLAYWRIGHT_EXTERNAL_STACK: '1'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
