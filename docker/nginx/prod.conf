# OBSOLÈTE — le frontal est désormais Caddy, sur l'hôte (voir docs/deploiement.md).
# Conservé à titre documentaire : ce fichier n'est plus monté par aucun compose.
# Les contrôles qu'il portait sont assurés ailleurs :
#   - TLS / HSTS / Permissions-Policy      -> Caddyfile de l'hôte
#   - CSP, X-Frame-Options, nosniff        -> docker/nginx/web.conf (image web) + Helmet (API)
#   - limit_req sur /api/v1/auth/          -> apps/api/src/middlewares/rateLimit.js (Redis, fail-closed)
#
# Nginx — PRODUCTION.
# Frontal unique : reverse proxy vers web (SPA) et API, TLS, headers de sécurité.
# Certificats Let's Encrypt : volume compose `letsencrypt` monté sur /etc/letsencrypt (ro).
# Adapter le dossier live au FQDN du certificat si une variante statique est préférée.

limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

upstream equime_web {
    server web:80;
}

upstream equime_api {
    server api:3000;
}

# HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    # Let's Encrypt live : /etc/letsencrypt/live/<FQDN>/fullchain.pem
    # $ssl_server_name = SNI. Nginx démarre même si le certificat n'est pas encore émis.
    ssl_certificate     /etc/letsencrypt/live/$ssl_server_name/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/$ssl_server_name/privkey.pem;
    # Variante statique (nginx refuse de démarrer si le fichier est absent) :
    # ssl_certificate     /etc/letsencrypt/live/example.fr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/example.fr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    client_max_body_size 8m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    location /api/v1/auth/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://equime_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://equime_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://equime_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
