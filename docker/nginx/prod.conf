# Nginx — PRODUCTION (SQUELETTE, durci et finalisé en Phase 6 :
# SSL Let's Encrypt, HSTS, rate limiting, gzip, CSP).
# Sert le build statique React et proxy /api vers l'API.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Headers de sécurité de base (complétés en Phase 6)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA : toute route inconnue renvoie index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long sur les assets fingerprintés par Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
