# Nginx — DÉVELOPPEMENT (non utilisé pour l'instant).
# En dev, le proxy /api est assuré directement par le serveur Vite
# (voir apps/web/vite.config.js). Cette conf est conservée pour
# tester localement un comportement proche de la préprod si besoin.

server {
    listen 80;
    server_name localhost;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:3000/health;
    }

    location / {
        proxy_pass http://web:5173;
        # WebSocket nécessaire au HMR de Vite
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
