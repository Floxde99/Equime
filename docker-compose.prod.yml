# Environnement de PRODUCTION — SQUELETTE, finalisé en Phase 6.
#
# Principe : postgres + redis sur réseau interne (aucun port exposé),
# api en image node:22-alpine multi-stage avec user non-root,
# web en build statique servi par Nginx, Nginx frontal unique point d'entrée
# (reverse proxy, SSL Let's Encrypt, headers de sécurité, rate limit, gzip).
#
# Usage prévu : docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
name: equime-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    # Réseau interne uniquement — aucun port exposé sur l'hôte

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # api:
  #   image: ghcr.io/<owner>/equime-api:latest    # déployée avec approbation manuelle (Phase 6)
  #   env_file: .env.prod
  #   depends_on: [postgres, redis]

  # web:
  #   image: ghcr.io/<owner>/equime-web:latest

  # nginx:
  #   image: nginx:1.27-alpine
  #   ports: ['80:80', '443:443']
  #   volumes:
  #     - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
  #     - letsencrypt:/etc/letsencrypt:ro

volumes:
  postgres-prod-data:
