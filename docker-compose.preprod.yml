# Environnement de PRÉPRODUCTION — iso-prod (Phase 6).
#
# Mêmes images multi-stage que la production, `.env.preprod`, base dédiée
# alimentée par le seed de recette (données réalistes anonymisées).
# C'est ici que le cahier de recette est exécuté avant chaque mise en prod.
#
# Le TLS et le routage sont assurés par Caddy sur l'hôte : les services sont
# publiés sur la loopback uniquement (Docker court-circuite ufw sans le
# préfixe 127.0.0.1). Caddy attaque `api` en direct pour /api/* afin que la
# chaîne ne comporte qu'un seul proxy — `trust proxy 1` (apps/api/src/app.js)
# reste ainsi correct et le rate limiting garde la vraie IP client.
#
# Usage :
#   cp .env.preprod.example .env.preprod   # puis adapter les secrets
#   docker compose -f docker-compose.preprod.yml --env-file .env.preprod up -d --build
#   docker compose -f docker-compose.preprod.yml --env-file .env.preprod run --rm migrate node prisma/seed-recette.js
name: equime-preprod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - postgres-preprod-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Migrations Prisma jouées avant le démarrage de l'API.
  # Cible `api-build` : elle embarque les devDependencies, donc le CLI Prisma
  # que `--omit=dev` retire de l'image de runtime.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: api-build
    env_file: .env.preprod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    working_dir: /app/apps/api
    command: ['npx', 'prisma', 'migrate', 'deploy']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: prod
    restart: unless-stopped
    env_file: .env.preprod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/uploads
    ports:
      - '127.0.0.1:3002:3000'
    volumes:
      - uploads-preprod-data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: prod
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      - api

volumes:
  postgres-preprod-data:
  uploads-preprod-data:
